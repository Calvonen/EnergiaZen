name: Apply V2 shadow settings split

on:
  push:
    branches:
      - feature/v2-percent-reserve-settings
    paths:
      - .github/workflows/apply-v2-shadow-settings-split.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: energiazen-mini
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/v2-percent-reserve-settings
          fetch-depth: 0
      - name: Split V1 and V2 settings UI
        run: node scripts/applyV2ShadowSettingsSplit.cjs
      - name: Commit patched UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/settings.tsx
          if git diff --cached --quiet; then
            echo "V1/V2 settings split already applied"
            exit 0
          fi
          git commit -m "fix(v2): keep production V1 reserve controls visible"
          git push origin HEAD:feature/v2-percent-reserve-settings
