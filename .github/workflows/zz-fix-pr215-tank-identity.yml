name: Apply PR215 exact tank identity fix

on:
  push:
    branches:
      - feature/heating-cooldown-blocked-marker

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/heating-cooldown-blocked-marker
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: energiazen-mini/package-lock.json

      - name: Apply exact backend tank identity fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path('energiazen-mini')

          helper = root / 'lib/heatingCooldownMarker.ts'
          text = helper.read_text(encoding='utf-8')
          text = text.replace(
            '  last_validated_plan_at: string | null;\n  validated_plan_date: string | null;',
            '  last_validated_plan_at: string | null;\n  validated_plan_date: string | null;\n  validated_tank_reading_at: string | null;',
            1,
          )
          old = '''  const readingAt = Date.parse(optimizerReadingCreatedAt ?? "");\n  const nowMs = now.getTime();\n  if (\n    !Number.isFinite(validationAt) ||\n    !Number.isFinite(readingAt) ||\n    validationAt > nowMs ||\n    nowMs - validationAt > backendOptimizerValidationMaxAgeMs ||\n    validationAt < readingAt ||\n    backendValidation.validated_plan_date !== todayPlanDate\n  ) {\n    return false;\n  }'''
          new = '''  const readingAt = Date.parse(optimizerReadingCreatedAt ?? "");\n  const validatedTankReadingAt = Date.parse(\n    backendValidation.validated_tank_reading_at ?? "",\n  );\n  const nowMs = now.getTime();\n  if (\n    !Number.isFinite(validationAt) ||\n    !Number.isFinite(readingAt) ||\n    !Number.isFinite(validatedTankReadingAt) ||\n    validationAt > nowMs ||\n    nowMs - validationAt > backendOptimizerValidationMaxAgeMs ||\n    validatedTankReadingAt !== readingAt ||\n    backendValidation.validated_plan_date !== todayPlanDate\n  ) {\n    return false;\n  }'''
          assert old in text
          helper.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = root / 'lib/heatingCooldownMarker.test.ts'
          text = test.read_text(encoding='utf-8')
          text = text.replace(
            '    validated_plan_date: "2025-01-15",\n    validated_plan_fingerprint: "2025-01-15|10",',
            '    validated_plan_date: "2025-01-15",\n    validated_tank_reading_at: "2025-01-15T08:29:00.000Z",\n    validated_plan_fingerprint: "2025-01-15|10",',
            1,
          )
          old = '''  assert.equal(\n    getCooldownBlockedHeatingHourId({\n      ...baseInput,\n      optimizerReadingCreatedAt: "2025-01-15T08:29:31.000Z",\n    }),\n    null,\n    "a tank reading newer than backend validation must suppress the marker",\n  );'''
          new = '''  assert.equal(\n    getCooldownBlockedHeatingHourId({\n      ...baseInput,\n      optimizerReadingCreatedAt: "2025-01-15T08:29:31.000Z",\n    }),\n    null,\n    "an app reading different from the backend validated tank snapshot must suppress the marker",\n  );\n  assert.equal(\n    getCooldownBlockedHeatingHourId({\n      ...baseInput,\n      backendValidation: {\n        ...baseBackendValidation,\n        validated_tank_reading_at: "2025-01-15T08:29:31.000Z",\n      },\n    }),\n    null,\n    "a newer backend tank snapshot than the app optimizer input must suppress the marker",\n  );'''
          assert old in text
          text = text.replace(old, new, 1)
          text = text.replace(
            '        validated_plan_date: "2025-10-26",\n        validated_plan_fingerprint: "2025-10-26|3",',
            '        validated_plan_date: "2025-10-26",\n        validated_tank_reading_at: "2025-10-26T00:29:00.000Z",\n        validated_plan_fingerprint: "2025-10-26|3",',
            1,
          )
          test.write_text(text, encoding='utf-8')

          index = root / 'app/(tabs)/index.tsx'
          text = index.read_text(encoding='utf-8')
          old = '"health_status,last_validated_plan_at,validated_plan_date,validated_planned_hours,validated_plan_fingerprint",'
          new = '"health_status,last_validated_plan_at,validated_plan_date,validated_planned_hours,validated_plan_fingerprint,validated_tank_reading_at",'
          assert old in text
          index.write_text(text.replace(old, new, 1), encoding='utf-8')

          migration = root / 'supabase/migrations/20260828090000_persist_backend_validated_tank_snapshot.sql'
          migration.write_text('''-- Persist the exact tank_readings row used by each successfully validated\n-- backend optimizer run so client diagnostics can correlate against the same\n-- input snapshot instead of relying only on validation ordering.\n\nalter table public.backend_heating_optimizer_state\n  add column if not exists validated_tank_reading_at timestamptz;\n\ndo $$\nbegin\n  if to_regprocedure(\n    'public.publish_backend_heating_optimizer_plans(uuid,timestamp with time zone,jsonb,jsonb,jsonb,jsonb,jsonb,timestamp with time zone,text,date,integer[],text)'\n  ) is not null and to_regprocedure(\n    'public.publish_backend_heating_optimizer_plans_without_tank_identity(uuid,timestamp with time zone,jsonb,jsonb,jsonb,jsonb,jsonb,timestamp with time zone,text,date,integer[],text)'\n  ) is null then\n    alter function public.publish_backend_heating_optimizer_plans(\n      uuid, timestamptz, jsonb, jsonb, jsonb, jsonb, jsonb, timestamptz,\n      text, date, integer[], text\n    ) rename to publish_backend_heating_optimizer_plans_without_tank_identity;\n  end if;\nend;\n$$;\n\nrevoke all on function public.publish_backend_heating_optimizer_plans_without_tank_identity(\n  uuid, timestamptz, jsonb, jsonb, jsonb, jsonb, jsonb, timestamptz,\n  text, date, integer[], text\n) from public, anon, authenticated, service_role;\n\nalter function public.publish_backend_heating_optimizer_plans_without_tank_identity(\n  uuid, timestamptz, jsonb, jsonb, jsonb, jsonb, jsonb, timestamptz,\n  text, date, integer[], text\n) security invoker;\n\ncreate or replace function public.publish_backend_heating_optimizer_plans(\n  p_run_id uuid,\n  p_run_started_at timestamptz,\n  p_changed_plans jsonb,\n  p_expected_settings jsonb,\n  p_expected_plan_versions jsonb,\n  p_expected_tank_snapshot jsonb,\n  p_expected_price_snapshot jsonb,\n  p_published_at timestamptz,\n  p_publish_reason text,\n  p_validated_plan_date date,\n  p_validated_planned_hours integer[],\n  p_validated_plan_fingerprint text\n) returns text\nlanguage plpgsql\nsecurity definer\nset search_path = public\nas $$\ndeclare\n  result text;\n  expected_created_at timestamptz;\nbegin\n  if p_expected_tank_snapshot is null\n    or jsonb_typeof(p_expected_tank_snapshot) <> 'object' then\n    return 'tank_snapshot_conflict';\n  end if;\n\n  select snapshot.created_at\n  into expected_created_at\n  from jsonb_to_record(p_expected_tank_snapshot) as snapshot(\n    created_at timestamptz\n  );\n\n  if expected_created_at is null then\n    return 'tank_snapshot_conflict';\n  end if;\n\n  result := public.publish_backend_heating_optimizer_plans_without_tank_identity(\n    p_run_id,\n    p_run_started_at,\n    p_changed_plans,\n    p_expected_settings,\n    p_expected_plan_versions,\n    p_expected_tank_snapshot,\n    p_expected_price_snapshot,\n    p_published_at,\n    p_publish_reason,\n    p_validated_plan_date,\n    p_validated_planned_hours,\n    p_validated_plan_fingerprint\n  );\n\n  if result in ('published', 'no_changes') then\n    update public.backend_heating_optimizer_state\n    set validated_tank_reading_at = expected_created_at,\n        updated_at = now()\n    where id = 1\n      and current_run_id = p_run_id\n      and current_run_started_at = p_run_started_at;\n\n    if not found then\n      raise exception 'optimizer heartbeat ownership lost while persisting validated tank identity';\n    end if;\n  end if;\n\n  return result;\nend;\n$$;\n\nrevoke all on function public.publish_backend_heating_optimizer_plans(\n  uuid, timestamptz, jsonb, jsonb, jsonb, jsonb, jsonb, timestamptz,\n  text, date, integer[], text\n) from public, anon, authenticated;\n\ngrant execute on function public.publish_backend_heating_optimizer_plans(\n  uuid, timestamptz, jsonb, jsonb, jsonb, jsonb, jsonb, timestamptz,\n  text, date, integer[], text\n) to service_role;\n''', encoding='utf-8')

          # Add a source-level regression check for the forward migration and exact client correlation.
          test_path = root / 'tests/heatingCooldownTankIdentityMigration.test.ts'
          test_path.write_text('''import { readFileSync } from "node:fs";\nimport { join } from "node:path";\n\nfunction assertSource(condition: boolean, message: string) {\n  if (!condition) {\n    throw new Error(message);\n  }\n}\n\nexport function runHeatingCooldownTankIdentityMigrationTests() {\n  const migration = readFileSync(\n    join(\n      process.cwd(),\n      "supabase/migrations/20260828090000_persist_backend_validated_tank_snapshot.sql",\n    ),\n    "utf8",\n  );\n  const helper = readFileSync(\n    join(process.cwd(), "lib/heatingCooldownMarker.ts"),\n    "utf8",\n  );\n\n  assertSource(\n    migration.includes("validated_tank_reading_at timestamptz") &&\n      migration.includes("set validated_tank_reading_at = expected_created_at") &&\n      migration.includes("result in ('published', 'no_changes')"),\n    "successful backend validation must persist the exact tank reading timestamp",\n  );\n  assertSource(\n    helper.includes("validatedTankReadingAt !== readingAt"),\n    "cooldown marker trust must require exact app/backend tank snapshot identity",\n  );\n}\n''', encoding='utf-8')

          runner = root / 'scripts/run-tank-temperature-forecast-tests.ts'
          text = runner.read_text(encoding='utf-8')
          import_anchor = 'import { runHeatingCooldownMarkerUnitTests } from "../lib/heatingCooldownMarker.test";'
          assert import_anchor in text
          text = text.replace(import_anchor, import_anchor + '\nimport { runHeatingCooldownTankIdentityMigrationTests } from "../tests/heatingCooldownTankIdentityMigration.test";', 1)
          call_anchor = '  runHeatingCooldownMarkerUnitTests();'
          assert call_anchor in text
          text = text.replace(call_anchor, call_anchor + '\n  runHeatingCooldownTankIdentityMigrationTests();', 1)
          runner.write_text(text, encoding='utf-8')

          tsconfig = root / 'tsconfig.forecast-tests.json'
          text = tsconfig.read_text(encoding='utf-8')
          anchor = '    "lib/heatingCooldownMarker.test.ts",'
          assert anchor in text
          text = text.replace(anchor, anchor + '\n    "tests/heatingCooldownTankIdentityMigration.test.ts",', 1)
          tsconfig.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        working-directory: energiazen-mini
        run: npm ci

      - name: Test
        working-directory: energiazen-mini
        run: npm test

      - name: Lint
        working-directory: energiazen-mini
        run: npm run lint

      - name: Typecheck
        working-directory: energiazen-mini
        run: npx tsc --noEmit

      - name: Commit and clean up one-shot workflow
        shell: bash
        run: |
          git config user.name "Calvonen"
          git config user.email "marko.raitanen@gmail.com"
          git rm .github/workflows/zz-fix-pr215-tank-identity.yml
          git add energiazen-mini/app/'(tabs)'/index.tsx \
            energiazen-mini/lib/heatingCooldownMarker.ts \
            energiazen-mini/lib/heatingCooldownMarker.test.ts \
            energiazen-mini/scripts/run-tank-temperature-forecast-tests.ts \
            energiazen-mini/tsconfig.forecast-tests.json \
            energiazen-mini/tests/heatingCooldownTankIdentityMigration.test.ts \
            energiazen-mini/supabase/migrations/20260828090000_persist_backend_validated_tank_snapshot.sql
          git commit -m "fix(heating): match cooldown marker tank snapshot"
          git push origin HEAD:feature/heating-cooldown-blocked-marker
