name: Apply heating boundary cooldown fix
on:
  push:
    branches: [fix/heating-post-block-boundary-cooldown]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/heating-post-block-boundary-cooldown
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply focused fix
        run: |
          python - <<'PY'
          from pathlib import Path

          logic = Path('energiazen-mini/supabase/functions/run-heating-optimizer/logic.ts')
          text = logic.read_text()
          marker = 'export type RawTankReading = {'
          helper = '''export function resolvePostHeatingCooldownHourStart({\n  hours,\n  latestHeating,\n  now,\n  recentReadings,\n  safetyTopTemperature,\n  storedTodayHours,\n  todayPlanDate,\n  topTemperature,\n}: {\n  hours: HeatingOptimizationHour[];\n  latestHeating: boolean | null;\n  now: Date;\n  recentReadings: TankTemperatureReading[];\n  safetyTopTemperature: number;\n  storedTodayHours: number[];\n  todayPlanDate: string;\n  topTemperature: number | null | undefined;\n}): number | null {\n  if (typeof topTemperature !== "number" || topTemperature < safetyTopTemperature) {\n    return null;\n  }\n\n  const currentHour = hours.find(\n    (hour) =>\n      getFinnishDateKey(hour.startDate) === todayPlanDate &&\n      hour.date.getTime() <= now.getTime() &&\n      hour.endDate.getTime() > now.getTime(),\n  );\n  if (!currentHour) {\n    return null;\n  }\n\n  const currentHourNumber = getHelsinkiHourNumber(currentHour.date);\n\n  // While an already-planned hour is actively heating, protect the next\n  // chronological interval from being appended to the same block.\n  if (latestHeating === true && storedTodayHours.includes(currentHourNumber)) {\n    const nextHour = hours.find(\n      (hour) => hour.date.getTime() === currentHour.endDate.getTime(),\n    );\n    if (\n      nextHour &&\n      getFinnishDateKey(nextHour.startDate) === todayPlanDate &&\n      !storedTodayHours.includes(getHelsinkiHourNumber(nextHour.date))\n    ) {\n      return nextHour.date.getTime();\n    }\n  }\n\n  // The relay can report false for a few minutes exactly at the hour\n  // boundary before a recalculated plan turns it back on. Do not let that\n  // transient false erase the fact that the immediately preceding interval\n  // was an actual heating block. If the current hour was already part of the\n  // authoritative plan, it remains valid and is never penalized.\n  if (storedTodayHours.includes(currentHourNumber)) {\n    return null;\n  }\n\n  const previousIntervalEnd = currentHour.date.getTime();\n  const previousIntervalStart = previousIntervalEnd - 60 * 60 * 1000;\n  if (\n    getFinnishDateKey(new Date(previousIntervalEnd - 1)) !== todayPlanDate\n  ) {\n    return null;\n  }\n\n  const previousIntervalActuallyHeated = recentReadings.some((reading) => {\n    if (reading.heating !== true || !reading.created_at) {\n      return false;\n    }\n    const readingAt = new Date(reading.created_at).getTime();\n    return (\n      Number.isFinite(readingAt) &&\n      readingAt >= previousIntervalStart &&\n      readingAt < previousIntervalEnd\n    );\n  });\n\n  return previousIntervalActuallyHeated ? currentHour.date.getTime() : null;\n}\n\n'''
          if helper not in text:
              assert marker in text
              text = text.replace(marker, helper + marker, 1)
              logic.write_text(text)

          index = Path('energiazen-mini/supabase/functions/run-heating-optimizer/index.ts')
          text = index.read_text()
          old_import = '  resolveOptimizerSettings,\n  resolveTankSnapshotRetryAction,'
          new_import = '  resolveOptimizerSettings,\n  resolvePostHeatingCooldownHourStart,\n  resolveTankSnapshotRetryAction,'
          assert old_import in text
          text = text.replace(old_import, new_import, 1)

          old = '''    const heating = latestReading?.heating ?? null;\n    const currentHourNumber = getHelsinkiHourNumber(attemptNow);\n    const storedTodayHours =\n      appTodayPlan?.mode === "automatic" && Array.isArray(appTodayPlan.planned_hours)\n        ? appTodayPlan.planned_hours\n            .filter((hour): hour is number => Number.isInteger(hour))\n            .map(Number)\n        : [];\n    const currentTopTemperature = latestReading?.top_temp;\n    const currentHour = hours.find(\n      (hour) =>\n        getFinnishDateKey(hour.startDate) === todayPlanDate &&\n        hour.date.getTime() <= attemptNow.getTime() &&\n        hour.endDate.getTime() > attemptNow.getTime(),\n    );\n    const nextHour = currentHour\n      ? hours.find((hour) => hour.date.getTime() === currentHour.endDate.getTime())\n      : undefined;\n    const nextHourNumber = nextHour ? getHelsinkiHourNumber(nextHour.date) : null;\n    const shouldApplyPostHeatingCooldown =\n      heating === true &&\n      typeof currentTopTemperature === "number" &&\n      currentTopTemperature >= postHeatingCooldownSafetyTopTemperature &&\n      storedTodayHours.includes(currentHourNumber) &&\n      nextHour !== undefined &&\n      getFinnishDateKey(nextHour.startDate) === todayPlanDate &&\n      nextHourNumber !== null &&\n      !storedTodayHours.includes(nextHourNumber);\n    const cooldownHourStart = shouldApplyPostHeatingCooldown\n      ? nextHour!.date.getTime()\n      : null;'''
          new = '''    const heating = latestReading?.heating ?? null;\n    const storedTodayHours =\n      appTodayPlan?.mode === "automatic" && Array.isArray(appTodayPlan.planned_hours)\n        ? appTodayPlan.planned_hours\n            .filter((hour): hour is number => Number.isInteger(hour))\n            .map(Number)\n        : [];\n    const currentTopTemperature = latestReading?.top_temp;\n    const cooldownHourStart = resolvePostHeatingCooldownHourStart({\n      hours,\n      latestHeating: heating,\n      now: attemptNow,\n      recentReadings: recoveryReadings,\n      safetyTopTemperature: postHeatingCooldownSafetyTopTemperature,\n      storedTodayHours,\n      todayPlanDate,\n      topTemperature: currentTopTemperature,\n    });'''
          assert old in text
          text = text.replace(old, new, 1)
          index.write_text(text)

          test = Path('energiazen-mini/supabase/functions/run-heating-optimizer/logic.test.ts')
          text = test.read_text()
          old_import = '  resolveOptimizerSettings,\n  resolveTankSnapshotRetryAction,'
          new_import = '  resolveOptimizerSettings,\n  resolvePostHeatingCooldownHourStart,\n  resolveTankSnapshotRetryAction,'
          assert old_import in text
          text = text.replace(old_import, new_import, 1)
          anchor = 'export function runRunHeatingOptimizerLogicUnitTests() {\n'
          tests = '''export function runRunHeatingOptimizerLogicUnitTests() {\n  const cooldownHours = buildOptimizerHours(\n    priceRowsBetween(\n      new Date("2026-09-01T04:00:00.000Z"),\n      new Date("2026-09-01T07:00:00.000Z"),\n    ),\n    new Date("2026-09-01T04:30:00.000Z"),\n    "2026-09-01",\n    "2026-09-02",\n  );\n  assertEqual(\n    resolvePostHeatingCooldownHourStart({\n      hours: cooldownHours,\n      latestHeating: true,\n      now: new Date("2026-09-01T04:30:00.000Z"),\n      recentReadings: [],\n      safetyTopTemperature: 50,\n      storedTodayHours: [7],\n      todayPlanDate: "2026-09-01",\n      topTemperature: 57.4,\n    }),\n    new Date("2026-09-01T05:00:00.000Z").getTime(),\n    "active planned heating must penalize the immediately following unplanned hour",\n  );\n  assertEqual(\n    resolvePostHeatingCooldownHourStart({\n      hours: buildOptimizerHours(\n        priceRowsBetween(\n          new Date("2026-09-01T05:00:00.000Z"),\n          new Date("2026-09-01T08:00:00.000Z"),\n        ),\n        new Date("2026-09-01T05:03:00.000Z"),\n        "2026-09-01",\n        "2026-09-02",\n      ),\n      latestHeating: false,\n      now: new Date("2026-09-01T05:03:00.000Z"),\n      recentReadings: [\n        { created_at: "2026-09-01T04:59:50.000Z", top_temp: 57.2, bottom_temp: 41.2, inlet_temp: 25, heating: true },\n        { created_at: "2026-09-01T05:02:50.000Z", top_temp: 57.2, bottom_temp: 41.9, inlet_temp: 25.3, heating: false },\n      ],\n      safetyTopTemperature: 50,\n      storedTodayHours: [7, 15],\n      todayPlanDate: "2026-09-01",\n      topTemperature: 57.2,\n    }),\n    new Date("2026-09-01T05:00:00.000Z").getTime(),\n    "a transient relay-off reading at the hour boundary must not allow the just-finished block to restart in the adjacent hour",\n  );\n  assertEqual(\n    resolvePostHeatingCooldownHourStart({\n      hours: buildOptimizerHours(\n        priceRowsBetween(\n          new Date("2026-09-01T05:00:00.000Z"),\n          new Date("2026-09-01T08:00:00.000Z"),\n        ),\n        new Date("2026-09-01T05:03:00.000Z"),\n        "2026-09-01",\n        "2026-09-02",\n      ),\n      latestHeating: false,\n      now: new Date("2026-09-01T05:03:00.000Z"),\n      recentReadings: [\n        { created_at: "2026-09-01T04:59:50.000Z", top_temp: 57.2, bottom_temp: 41.2, inlet_temp: 25, heating: true },\n      ],\n      safetyTopTemperature: 50,\n      storedTodayHours: [7, 8, 15],\n      todayPlanDate: "2026-09-01",\n      topTemperature: 57.2,\n    }),\n    null,\n    "an adjacent hour that was already in the authoritative plan must remain valid",\n  );\n  assertEqual(\n    resolvePostHeatingCooldownHourStart({\n      hours: buildOptimizerHours(\n        priceRowsBetween(\n          new Date("2026-09-01T05:00:00.000Z"),\n          new Date("2026-09-01T08:00:00.000Z"),\n        ),\n        new Date("2026-09-01T05:03:00.000Z"),\n        "2026-09-01",\n        "2026-09-02",\n      ),\n      latestHeating: false,\n      now: new Date("2026-09-01T05:03:00.000Z"),\n      recentReadings: [\n        { created_at: "2026-09-01T04:59:50.000Z", top_temp: 49.9, bottom_temp: 35, inlet_temp: 20, heating: true },\n      ],\n      safetyTopTemperature: 50,\n      storedTodayHours: [7],\n      todayPlanDate: "2026-09-01",\n      topTemperature: 49.9,\n    }),\n    null,\n    "top temperature below the safety threshold must bypass cooldown",\n  );\n'''
          assert anchor in text
          text = text.replace(anchor, tests, 1)
          test.write_text(text)
          PY
      - name: Install and verify
        working-directory: energiazen-mini
        run: |
          npm ci
          npm test
          npm run lint
          npx tsc --noEmit
      - name: Commit fix and remove temporary workflow
        run: |
          rm .github/workflows/zz-fix-heating-boundary-cooldown.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add energiazen-mini/supabase/functions/run-heating-optimizer/index.ts energiazen-mini/supabase/functions/run-heating-optimizer/logic.ts energiazen-mini/supabase/functions/run-heating-optimizer/logic.test.ts .github/workflows/zz-fix-heating-boundary-cooldown.yml
          git commit -m "fix(heating): preserve cooldown across hour boundary"
          git push origin HEAD:fix/heating-post-block-boundary-cooldown
