name: Apply PR215 full price-input correlation
on:
  push:
    branches: [feature/heating-cooldown-blocked-marker]
permissions:
  contents: write
jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/heating-cooldown-blocked-marker
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply full price-input correlation fix
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              assert old in text, f'missing expected snippet in {path}'
              text = text.replace(old, new, 1)
              p.write_text(text)

          replace(
              'energiazen-mini/supabase/functions/run-heating-optimizer/logic.ts',
              '''export function buildExpectedElectricityPriceSnapshot(\n  hours: HeatingOptimizationHour[],\n  region = "FI",\n): ExpectedElectricityPriceSnapshotRow[] {\n  return hours\n    .map((hour) => ({\n      ends_at: hour.endDate.toISOString(),\n      region,\n      resolution_minutes: 60 as const,\n      spot_price_cents_kwh: hour.price,\n      starts_at: hour.startDate,\n    }))\n    .sort((first, second) => first.starts_at.localeCompare(second.starts_at));\n}\n''',
              '''export function buildExpectedElectricityPriceSnapshot(\n  prices: RawElectricityPriceRow[],\n  todayPlanDate: string,\n  tomorrowPlanDate: string,\n  region = "FI",\n): ExpectedElectricityPriceSnapshotRow[] {\n  return prices\n    .filter((price) => {\n      if (price.resolution_minutes !== 60) {\n        return false;\n      }\n      const dateKey = getFinnishDateKey(price.starts_at);\n      return dateKey === todayPlanDate || dateKey === tomorrowPlanDate;\n    })\n    .map((price) => ({\n      ends_at: new Date(price.ends_at).toISOString(),\n      region,\n      resolution_minutes: 60 as const,\n      spot_price_cents_kwh: price.spot_price_cents_kwh,\n      starts_at: price.starts_at,\n    }))\n    .sort((first, second) => first.starts_at.localeCompare(second.starts_at));\n}\n''')

          replace(
              'energiazen-mini/supabase/functions/run-heating-optimizer/index.ts',
              '''      const expectedPriceSnapshot = buildExpectedElectricityPriceSnapshot(\n        hours,\n        electricityPriceRegion,\n      );\n''',
              '''      const expectedPriceSnapshot = buildExpectedElectricityPriceSnapshot(\n        prices,\n        todayPlanDate,\n        tomorrowPlanDate,\n        electricityPriceRegion,\n      );\n''')

          p = Path('energiazen-mini/lib/heatingCooldownMarker.ts')
          text = p.read_text()
          text = text.replace(
              'type ComparablePriceSnapshotRow = {',
              'type CooldownPriceHour = Pick<HeatingOptimizationHour, "date" | "endDate" | "price" | "startDate">;\n\ntype ComparablePriceSnapshotRow = {',
              1,
          )
          old = '''export function buildCooldownPriceSnapshot(\n  optimizerHours: HeatingOptimizationHour[],\n): ComparablePriceSnapshotRow[] {\n  return optimizerHours\n    .map((hour) => ({\n      ends_at: hour.endDate.toISOString(),\n      region: "FI",\n      resolution_minutes: 60,\n      spot_price_cents_kwh: hour.price,\n      starts_at: hour.startDate,\n    }))\n    .sort((first, second) => first.starts_at.localeCompare(second.starts_at));\n}\n'''
          new = '''export function buildCooldownPriceSnapshot(\n  priceHours: CooldownPriceHour[],\n  todayPlanDate: string,\n  tomorrowPlanDate: string,\n): ComparablePriceSnapshotRow[] {\n  return priceHours\n    .filter((hour) => {\n      const dateKey = getFinnishDateKey(hour.startDate);\n      return dateKey === todayPlanDate || dateKey === tomorrowPlanDate;\n    })\n    .map((hour) => ({\n      ends_at: hour.endDate.toISOString(),\n      region: "FI",\n      resolution_minutes: 60,\n      spot_price_cents_kwh: hour.price,\n      starts_at: hour.startDate,\n    }))\n    .sort((first, second) => first.starts_at.localeCompare(second.starts_at));\n}\n'''
          assert old in text
          text = text.replace(old, new, 1)
          text = text.replace(
              '  optimizerHours,\n  optimizerReadingCreatedAt,',
              '  optimizerHours,\n  priceHours,\n  optimizerReadingCreatedAt,',
              1,
          )
          text = text.replace(
              '  optimizerHours: HeatingOptimizationHour[];\n  optimizerReadingCreatedAt: string | null;',
              '  optimizerHours: HeatingOptimizationHour[];\n  priceHours: CooldownPriceHour[];\n  optimizerReadingCreatedAt: string | null;',
              1,
          )
          text = text.replace(
              '  todayPlanDate,\n}: {',
              '  todayPlanDate,\n  tomorrowPlanDate,\n}: {',
              1,
          )
          text = text.replace(
              '  todayPlanDate: string;\n}): boolean {',
              '  todayPlanDate: string;\n  tomorrowPlanDate: string;\n}): boolean {',
              1,
          )
          text = text.replace(
              '  const appPriceSnapshot = buildCooldownPriceSnapshot(optimizerHours);',
              '  const appPriceSnapshot = buildCooldownPriceSnapshot(\n    priceHours,\n    todayPlanDate,\n    tomorrowPlanDate,\n  );',
              1,
          )
          # getCooldown function params/types and validation call
          text = text.replace(
              '  optimizerHours,\n  optimizerReadingCreatedAt,\n  optimizerSelectedHourIds,',
              '  optimizerHours,\n  priceHours,\n  optimizerReadingCreatedAt,\n  optimizerSelectedHourIds,',
              1,
          )
          text = text.replace(
              '  optimizerHours: HeatingOptimizationHour[];\n  optimizerReadingCreatedAt: string | null;\n  optimizerSelectedHourIds: string[];',
              '  optimizerHours: HeatingOptimizationHour[];\n  priceHours: CooldownPriceHour[];\n  optimizerReadingCreatedAt: string | null;\n  optimizerSelectedHourIds: string[];',
              1,
          )
          text = text.replace(
              '  todayPlanDate,\n  topTemperature,\n}: {',
              '  todayPlanDate,\n  tomorrowPlanDate,\n  topTemperature,\n}: {',
              1,
          )
          text = text.replace(
              '  todayPlanDate: string;\n  topTemperature: number | null;',
              '  todayPlanDate: string;\n  tomorrowPlanDate: string;\n  topTemperature: number | null;',
              1,
          )
          text = text.replace(
              '      optimizerHours,\n      optimizerReadingCreatedAt,',
              '      optimizerHours,\n      priceHours,\n      optimizerReadingCreatedAt,',
              1,
          )
          text = text.replace(
              '      storedTodayHours,\n      todayPlanDate,\n    })',
              '      storedTodayHours,\n      todayPlanDate,\n      tomorrowPlanDate,\n    })',
              1,
          )
          p.write_text(text)

          replace(
              'energiazen-mini/app/(tabs)/index.tsx',
              '''      optimizerHours: publishedOptimizerHours,\n      optimizerReadingCreatedAt: activeOptimizationRun.readingCreatedAt,\n''',
              '''      optimizerHours: publishedOptimizerHours,\n      priceHours: hourlyPrices,\n      optimizerReadingCreatedAt: activeOptimizationRun.readingCreatedAt,\n''')
          replace(
              'energiazen-mini/app/(tabs)/index.tsx',
              '''      todayPlanDate: publishedTodayPlanDate,\n      topTemperature: topTemp,\n''',
              '''      todayPlanDate: publishedTodayPlanDate,\n      tomorrowPlanDate: publishedTomorrowPlanDate,\n      topTemperature: topTemp,\n''')
          replace(
              'energiazen-mini/app/(tabs)/index.tsx',
              '''    heatingOptimization?.selectedHeatingHourIds,\n    isCurrentlyHeatingConfirmed,\n''',
              '''    heatingOptimization?.selectedHeatingHourIds,\n    hourlyPrices,\n    isCurrentlyHeatingConfirmed,\n''')
          replace(
              'energiazen-mini/app/(tabs)/index.tsx',
              '''    publishedOptimizerHours,\n    publishedTodayPlanDate,\n''',
              '''    publishedOptimizerHours,\n    publishedTodayPlanDate,\n    publishedTomorrowPlanDate,\n''')

          p = Path('energiazen-mini/lib/heatingCooldownMarker.test.ts')
          text = p.read_text()
          text = text.replace(
              '  const baseOptimizerHours = [currentHour, nextHour];\n',
              '  const pastHour = createHour("past", "2025-01-15T02:00:00+02:00", 0.5);\n  const baseOptimizerHours = [currentHour, nextHour];\n  const basePriceHours = [pastHour, currentHour, nextHour];\n',
              1,
          )
          text = text.replace(
              '    validated_price_snapshot: buildCooldownPriceSnapshot(baseOptimizerHours),',
              '    validated_price_snapshot: buildCooldownPriceSnapshot(\n      basePriceHours,\n      "2025-01-15",\n      "2025-01-16",\n    ),',
              1,
          )
          text = text.replace(
              '    optimizerHours: baseOptimizerHours,\n    optimizerReadingCreatedAt:',
              '    optimizerHours: baseOptimizerHours,\n    priceHours: basePriceHours,\n    optimizerReadingCreatedAt:',
              1,
          )
          text = text.replace(
              '    todayPlanDate: "2025-01-15",\n    topTemperature:',
              '    todayPlanDate: "2025-01-15",\n    tomorrowPlanDate: "2025-01-16",\n    topTemperature:',
              1,
          )
          text = text.replace(
              '''  const appPriceChangedHours = [\n    currentHour,\n    createHour("next", "2025-01-15T11:00:00+02:00", 2),\n  ];\n''',
              '''  const appPriceChangedHours = [\n    pastHour,\n    currentHour,\n    createHour("next", "2025-01-15T11:00:00+02:00", 2),\n  ];\n''',
              1,
          )
          text = text.replace(
              '      optimizerHours: appPriceChangedHours,',
              '      priceHours: appPriceChangedHours,',
              1,
          )
          marker = '''  assert.equal(\n    getCooldownBlockedHeatingHourId({\n      ...baseInput,\n      backendValidation: {\n        ...baseBackendValidation,\n        validated_price_snapshot: null,\n      },\n    }),\n    null,\n    "missing backend price identity must fail closed",\n  );\n'''
          addition = marker + '''  const changedPastMinimumPriceHours = [\n    createHour("past", "2025-01-15T02:00:00+02:00", 0.25),\n    currentHour,\n    nextHour,\n  ];\n  assert.equal(\n    getCooldownBlockedHeatingHourId({\n      ...baseInput,\n      priceHours: changedPastMinimumPriceHours,\n    }),\n    null,\n    "a changed already-ended daily-minimum price must suppress the marker",\n  );\n'''
          assert marker in text
          text = text.replace(marker, addition, 1)
          text = text.replace(
              '        validated_price_snapshot: buildCooldownPriceSnapshot(repeatedHours),',
              '        validated_price_snapshot: buildCooldownPriceSnapshot(\n          repeatedHours,\n          "2025-10-26",\n          "2025-10-27",\n        ),',
              1,
          )
          text = text.replace(
              '      optimizerHours: repeatedHours,\n      optimizerReadingCreatedAt:',
              '      optimizerHours: repeatedHours,\n      priceHours: repeatedHours,\n      optimizerReadingCreatedAt:',
              1,
          )
          text = text.replace(
              '      todayPlanDate: "2025-10-26",\n    }),',
              '      todayPlanDate: "2025-10-26",\n      tomorrowPlanDate: "2025-10-27",\n    }),',
              1,
          )
          p.write_text(text)
          PY
      - name: Install dependencies
        working-directory: energiazen-mini
        run: npm ci
      - name: Test
        working-directory: energiazen-mini
        run: npm test
      - name: Lint
        working-directory: energiazen-mini
        run: npm run lint
      - name: Typecheck
        working-directory: energiazen-mini
        run: npx tsc --noEmit
      - name: Commit and clean up one-shot workflow
        run: |
          rm .github/workflows/zz-fix-pr215-full-price-input.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(heating): correlate full optimizer price input"
          git push origin HEAD:feature/heating-cooldown-blocked-marker
