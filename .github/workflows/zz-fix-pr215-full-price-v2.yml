name: Apply PR215 full price input fix v2

on:
  push:
    branches:
      - feature/heating-cooldown-blocked-marker

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/heating-cooldown-blocked-marker
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: energiazen-mini/package-lock.json

      - name: Apply fix
        run: python3 scripts/pr215_full_price_fix.py

      - name: Install dependencies
        working-directory: energiazen-mini
        run: npm ci

      - name: Test
        working-directory: energiazen-mini
        run: npm test

      - name: Lint
        working-directory: energiazen-mini
        run: npm run lint

      - name: Typecheck
        working-directory: energiazen-mini
        run: npx tsc --noEmit

      - name: Commit and clean up
        run: |
          git config user.name "Calvonen"
          git config user.email "marko.raitanen@gmail.com"
          git rm .github/workflows/zz-fix-pr215-full-price-v2.yml scripts/pr215_full_price_fix.py
          git add energiazen-mini
          git commit -m "fix(heating): correlate full optimizer price input"
          git push origin HEAD:feature/heating-cooldown-blocked-marker
