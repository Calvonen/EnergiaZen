name: Stage hard heating block lock

on:
  push:
    branches:
      - fix/hard-heating-block-lock

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hard-heating-block-lock
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: energiazen-mini/package-lock.json
      - name: Apply patch
        run: python3 .github/scripts/hard_block_patch.py
      - name: Install
        working-directory: energiazen-mini
        run: npm ci
      - name: Test
        working-directory: energiazen-mini
        run: npm test
      - name: Lint
        working-directory: energiazen-mini
        run: npm run lint
      - name: Typecheck
        working-directory: energiazen-mini
        run: npx tsc --noEmit
      - name: Commit
        run: |
          git config user.name "Calvonen"
          git config user.email "marko.raitanen@gmail.com"
          rm .github/workflows/zz-hard-heating-block-lock.yml
          rm .github/scripts/hard_block_patch.py
          git add -A
          git commit -m "fix(heating): hard-lock active heating block"
          git push origin HEAD:fix/hard-heating-block-lock
