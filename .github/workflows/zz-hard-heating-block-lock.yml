    hours: buildOptimizerHours(
      priceRowsBetween(
        new Date("2026-09-03T02:00:00.000Z"),
        new Date("2026-09-03T06:00:00.000Z"),
      ),
      new Date("2026-09-03T02:18:00.000Z"),
      "2026-09-03",
      "2026-09-04",
    ),
    latestHeating: true,
    now: new Date("2026-09-03T02:18:00.000Z"),
