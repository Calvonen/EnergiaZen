  const afterBlockHour = createHour("after-block", "2025-01-15T12:00:00+02:00");
  const twoHourBlock = [currentHour, secondPlannedHour, afterBlockHour];
  const twoHourPriceHours = [pastHour, ...twoHourBlock];
  assert.equal(
