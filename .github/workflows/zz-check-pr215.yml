name: Verify PR215 after P2 fix

on:
  push:
    branches:
      - feature/heating-cooldown-blocked-marker

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/heating-cooldown-blocked-marker
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: energiazen-mini/package-lock.json

      - name: Install dependencies
        working-directory: energiazen-mini
        run: npm ci

      - name: Test
        working-directory: energiazen-mini
        run: npm test

      - name: Lint
        working-directory: energiazen-mini
        run: npm run lint

      - name: Typecheck
        working-directory: energiazen-mini
        run: npx tsc --noEmit

      - name: Remove one-shot workflow
        run: |
          git config user.name "Calvonen"
          git config user.email "marko.raitanen@gmail.com"
          git rm .github/workflows/zz-check-pr215.yml
          git commit -m "chore: remove PR215 verification workflow"
          git push origin HEAD:feature/heating-cooldown-blocked-marker
