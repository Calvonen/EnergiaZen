name: V2 shadow tests

on:
  pull_request:
    paths:
      - "energiazen-mini/lib/energyModelV2/**"
      - "energiazen-mini/supabase/functions/run-v2-energy-shadow/**"
      - "energiazen-mini/supabase/functions/_shared/energyModelV2/**"
      - "energiazen-mini/supabase/functions/_shared/settingsDefaults.ts"
      - "energiazen-mini/lib/heatingControlSettingsPayload.ts"
      - "energiazen-mini/lib/settingsDraft.ts"
      - "energiazen-mini/app/settings.tsx"
      - "energiazen-mini/scripts/applyV2PercentReserveSettingsUi.cjs"
      - "energiazen-mini/supabase/migrations/**"
      - "energiazen-mini/supabase/functions/_shared/waterDrawDetection.ts"
      - "energiazen-mini/supabase/functions/_shared/tankReadingFreshness.ts"
      - "energiazen-mini/supabase/functions/_shared/tankMonitorAlert.ts"
      - "energiazen-mini/tsconfig.v2-live-shadow-tests.json"
      - "energiazen-mini/tsconfig.v2-energy-forecast-tests.json"
      - "energiazen-mini/tsconfig.forecast-tests.json"
      - "energiazen-mini/package.json"
      - "energiazen-mini/package-lock.json"
      - ".github/workflows/v2-shadow-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: energiazen-mini
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: energiazen-mini/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run V2 and forecast tests
        run: npm test
      - name: Run V2 energy forecast horizon tests
        run: npx tsc -p tsconfig.v2-energy-forecast-tests.json && node .tmp-v2-energy-forecast-tests/scripts/runEnergyForecastTests.js
      - name: Run live V2 energy plan shadow tests
        run: npx tsc -p tsconfig.v2-live-shadow-tests.json && node -e "require('./.tmp-v2-live-shadow-tests/supabase/functions/run-v2-energy-shadow/planShadow.test.js').runLivePlanShadowUnitTests()"

  patch-percent-settings-ui:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/v2-percent-reserve-settings'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: energiazen-mini
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: feature/v2-percent-reserve-settings
          fetch-depth: 0
      - name: Apply V2 percent settings UI patch
        run: node scripts/applyV2PercentReserveSettingsUi.cjs
      - name: Commit patched settings UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/settings.tsx
          if git diff --cached --quiet; then
            echo "V2 percent settings UI already applied"
            exit 0
          fi
          git commit -m "feat(v2): show reserve percentages with kWh detail"
          git push origin HEAD:feature/v2-percent-reserve-settings
