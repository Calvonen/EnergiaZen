name: V2 shadow tests

on:
  pull_request:
    paths:
      - "energiazen-mini/lib/energyModelV2/**"
      - "energiazen-mini/supabase/functions/run-v2-energy-shadow/**"
      - "energiazen-mini/supabase/functions/_shared/energyModelV2/**"
      - "energiazen-mini/supabase/functions/_shared/settingsDefaults.ts"
      - "energiazen-mini/lib/heatingControlSettingsPayload.ts"
      - "energiazen-mini/lib/settingsDraft.ts"
      - "energiazen-mini/lib/settingsDraft.test.ts"
      - "energiazen-mini/lib/settingsScenario.test.ts"
      - "energiazen-mini/app/settings.tsx"
      - "energiazen-mini/app/(tabs)/index.tsx"
      - "energiazen-mini/supabase/migrations/**"
      - "energiazen-mini/supabase/functions/_shared/waterDrawDetection.ts"
      - "energiazen-mini/supabase/functions/_shared/tankReadingFreshness.ts"
      - "energiazen-mini/supabase/functions/_shared/tankMonitorAlert.ts"
      - "energiazen-mini/tsconfig.v2-live-shadow-tests.json"
      - "energiazen-mini/tsconfig.v2-energy-forecast-tests.json"
      - "energiazen-mini/tsconfig.forecast-tests.json"
      - "energiazen-mini/package.json"
      - "energiazen-mini/package-lock.json"
      - ".github/workflows/v2-shadow-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: energiazen-mini
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: energiazen-mini/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run V2 and forecast tests
        run: npm test
      - name: Run V2 energy forecast horizon tests
        run: npx tsc -p tsconfig.v2-energy-forecast-tests.json && node .tmp-v2-energy-forecast-tests/scripts/runEnergyForecastTests.js
      - name: Run live V2 energy plan shadow tests
        run: |
          npx tsc -p tsconfig.v2-live-shadow-tests.json
          node -e "require('./.tmp-v2-live-shadow-tests/supabase/functions/run-v2-energy-shadow/liveWaterDrawReanchor.test.js').runLiveWaterDrawReanchorUnitTests()"
          node -e "require('./.tmp-v2-live-shadow-tests/supabase/functions/run-v2-energy-shadow/planShadow.test.js').runLivePlanShadowUnitTests()"
          node -e "require('./.tmp-v2-live-shadow-tests/supabase/functions/run-v2-energy-shadow/preheatPolicy.test.js').runV2PreheatPolicyUnitTests()"
          node -e "require('./.tmp-v2-live-shadow-tests/supabase/functions/run-v2-energy-shadow/preheatLevel.test.js').runV2SoftPreheatLevelUnitTests()"
          node -e "require('./.tmp-v2-live-shadow-tests/supabase/functions/run-v2-energy-shadow/preheatPlan.test.js').runV2PreheatPlanUnitTests()"
          node -e "require('./.tmp-v2-live-shadow-tests/supabase/functions/run-v2-energy-shadow/preheatAdvisory.test.js').runV2PreheatAdvisoryUnitTests()"
          node -e "require('./.tmp-v2-live-shadow-tests/supabase/functions/run-v2-energy-shadow/preheatMarginalCost.test.js').runV2MarginalPreheatCostUnitTests()"
          node -e "require('./.tmp-v2-live-shadow-tests/supabase/functions/run-v2-energy-shadow/preheatMarginalAdvisory.test.js').runV2MarginalPreheatAdvisoryUnitTests()"
          node -e "require('./.tmp-v2-live-shadow-tests/supabase/functions/run-v2-energy-shadow/priceCeilingPolicy.test.js').runV2PriceCeilingPolicyUnitTests()"
          node -e "require('./.tmp-v2-live-shadow-tests/supabase/functions/run-v2-energy-shadow/priceCeilingSetting.test.js').runV2PriceCeilingSettingUnitTests()"
          node -e "require('./.tmp-v2-live-shadow-tests/supabase/functions/run-v2-energy-shadow/productionConstraints.test.js').runProductionConstraintUnitTests()"
          node -e "require('./.tmp-v2-live-shadow-tests/supabase/functions/run-v2-energy-shadow/publicationGuard.test.js').runV2PublicationGuardUnitTests()"
          node -e "require('./.tmp-v2-live-shadow-tests/supabase/functions/run-v2-energy-shadow/publicationPayload.test.js').runV2PublicationPayloadUnitTests()"
          node -e "require('./.tmp-v2-live-shadow-tests/supabase/functions/run-v2-energy-shadow/stagedPublication.test.js').runV2StagedPublicationUnitTests()"
