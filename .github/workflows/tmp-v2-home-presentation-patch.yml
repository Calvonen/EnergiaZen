name: Temporary V2 home presentation patch

on:
  push:
    branches:
      - fix/v2-home-and-settings-presentation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2-home-and-settings-presentation
          fetch-depth: 0
      - name: Apply presentation-only V2 gate
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('energiazen-mini/app/(tabs)/index.tsx')
          text = path.read_text()

          old = 'const BACKEND_PRIMARY_HEATING_PLAN_ENABLED = true;\n'
          new = '''const BACKEND_PRIMARY_HEATING_PLAN_ENABLED = true;\n\n// Presentation-only staged rollout. This intentionally does not change the\n// authoritative heating plan, publication, or Shelly control path. Disable\n// this flag to restore the legacy stored-plan card during a UI rollback.\nconst V2_HOME_SHADOW_PRESENTATION_ENABLED = true;\n'''
          if old not in text:
              raise SystemExit('backend-primary anchor not found')
          text = text.replace(old, new, 1)

          old = '''    const isV2EnergyPlan = storedPlans.some(\n      (plan) => plan.reason === "V2 energy plan",\n    );\n'''
          new = '''    const isV2EnergyPlan = storedPlans.some(\n      (plan) => plan.reason === "V2 energy plan",\n    );\n    const useV2HomePresentation =\n      V2_HOME_SHADOW_PRESENTATION_ENABLED || isV2EnergyPlan;\n'''
          if old not in text:
              raise SystemExit('isV2EnergyPlan anchor not found')
          text = text.replace(old, new, 1)

          old = '''    const forecast =\n      !isV2EnergyPlan &&\n      storedSelectedHeatingHourIds.length === storedPlannedHourCount\n'''
          new = '''    const forecast =\n      !useV2HomePresentation &&\n      storedSelectedHeatingHourIds.length === storedPlannedHourCount\n'''
          if old not in text:
              raise SystemExit('forecast gate anchor not found')
          text = text.replace(old, new, 1)

          old = '''    return buildStoredHeatingPlanPresentation({\n      currentOptimizerPresentation: isV2EnergyPlan\n        ? null\n        : activeOptimizerPresentation,\n      forecast,\n      selectedHours,\n      v2EnergyReserve: isV2EnergyPlan ? v2HomeReserve : null,\n    });\n'''
          new = '''    return buildStoredHeatingPlanPresentation({\n      currentOptimizerPresentation: useV2HomePresentation\n        ? null\n        : activeOptimizerPresentation,\n      forecast,\n      selectedHours,\n      v2EnergyReserve: useV2HomePresentation ? v2HomeReserve : null,\n    });\n'''
          if old not in text:
              raise SystemExit('stored presentation anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-v2-home-presentation-patch.yml
          git add 'energiazen-mini/app/(tabs)/index.tsx'
          git commit -m 'fix(home): gate V2 shadow presentation separately'
          git push origin HEAD:fix/v2-home-and-settings-presentation
