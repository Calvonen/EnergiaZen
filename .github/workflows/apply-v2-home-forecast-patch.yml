name: Clean V2 patch artifacts

on:
  push:
    branches:
      - feature/v2-home-forecast-final
    paths:
      - ".github/workflows/apply-v2-home-forecast-patch.yml"

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v2-home-forecast-final
          fetch-depth: 0

      - name: Remove temporary patch artifacts
        run: |
          git rm -r --ignore-unmatch energiazen-mini/.tmp-v2-live-shadow-tests
          git rm --ignore-unmatch .github/scripts/apply_v2_home_forecast_patch.py
          git rm --ignore-unmatch .github/workflows/apply-v2-home-forecast-patch.yml
          git config user.name "EnergyZen automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore: remove temporary V2 patch artifacts"
          git push origin HEAD:feature/v2-home-forecast-final
