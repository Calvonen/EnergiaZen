name: Apply V2 home forecast patch

on:
  push:
    branches:
      - feature/v2-home-forecast-final
    paths:
      - ".github/workflows/apply-v2-home-forecast-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/v2-home-forecast-final
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/apply_v2_home_forecast_patch.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: energiazen-mini/package-lock.json

      - name: Install dependencies
        working-directory: energiazen-mini
        run: npm ci

      - name: Test
        working-directory: energiazen-mini
        run: npm test

      - name: Typecheck
        working-directory: energiazen-mini
        run: npx tsc --noEmit

      - name: Lint
        working-directory: energiazen-mini
        run: npm run lint

      - name: Commit patch
        run: |
          git config user.name "EnergyZen automation"
          git config user.email "actions@users.noreply.github.com"
          git add energiazen-mini
          git commit -m "feat(v2): show authoritative energy forecast on home"
          git push origin HEAD:feature/v2-home-forecast-final
