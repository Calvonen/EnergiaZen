name: Apply PR215 price correlation wiring

on:
  push:
    branches:
      - feature/heating-cooldown-blocked-marker

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/heating-cooldown-blocked-marker
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: energiazen-mini/package-lock.json

      - name: Wire validated price snapshot into Home diagnostic
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('energiazen-mini/app/(tabs)/index.tsx')
          text = path.read_text(encoding='utf-8')
          old = '"health_status,last_validated_plan_at,validated_plan_date,validated_planned_hours,validated_plan_fingerprint,validated_tank_reading_at",'
          new = '"health_status,last_validated_plan_at,validated_plan_date,validated_planned_hours,validated_plan_fingerprint,validated_tank_reading_at,validated_price_snapshot",'
          assert old in text, 'backend state select string not found'
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        working-directory: energiazen-mini
        run: npm ci

      - name: Test
        working-directory: energiazen-mini
        run: npm test

      - name: Lint
        working-directory: energiazen-mini
        run: npm run lint

      - name: Typecheck
        working-directory: energiazen-mini
        run: npx tsc --noEmit

      - name: Commit and clean up one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/zz-fix-pr215-price-correlation.yml
          git config user.name "Calvonen"
          git config user.email "marko.raitanen@gmail.com"
          git add energiazen-mini/app/'(tabs)'/index.tsx .github/workflows/zz-fix-pr215-price-correlation.yml
          git commit -m "fix(heating): require matching price snapshot for cooldown marker"
          git push origin HEAD:feature/heating-cooldown-blocked-marker
