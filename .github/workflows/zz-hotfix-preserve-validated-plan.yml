name: Stage validated-plan trust hotfix
on:
  push:
    branches: [fix/preserve-validated-plan-on-optimizer-invalid]
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch Shelly trust logic and tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          controller = Path('energiazen-mini/shelly/energyzen-controller.js')
          text = controller.read_text()

          old = 'let MAX_BACKEND_VALIDATION_AGE_SECONDS = 90 * 60;\n'
          new = old + '// If a later optimizer run is invalid, an already validated matching plan may\n// still run only while the backend itself is demonstrably alive. The cron runs\n// every five minutes, so 15 minutes leaves room for transient scheduling delay\n// without allowing a dead backend to keep an old plan trusted indefinitely.\nlet MAX_BACKEND_RUN_ATTEMPT_AGE_SECONDS = 15 * 60;\n'
          assert old in text
          text = text.replace(old, new, 1)

          old = '''function isTrustedBackendHeartbeat(rows, error, planRow, nowSeconds) {\n  if (error !== null || !Array.isArray(rows) || rows.length !== 1 || !planRow) return false;\n  let row = rows[0];\n  let validatedAtSeconds = parsePostgresTimestampSeconds(row.last_validated_plan_at);\n  let ageSeconds = nowSeconds - validatedAtSeconds;\n  let planFingerprint = buildPlanFingerprint(planRow.plan_date, planRow.planned_hours);\n  return row.health_status === "healthy" && isFinite(validatedAtSeconds) && ageSeconds >= 0 && ageSeconds <= MAX_BACKEND_VALIDATION_AGE_SECONDS && planFingerprint !== null && row.validated_plan_fingerprint === planFingerprint;\n}\n'''
          new = '''function isTrustedBackendHeartbeat(rows, error, planRow, nowSeconds) {\n  if (error !== null || !Array.isArray(rows) || rows.length !== 1 || !planRow) return false;\n  let row = rows[0];\n  let validatedAtSeconds = parsePostgresTimestampSeconds(row.last_validated_plan_at);\n  let validationAgeSeconds = nowSeconds - validatedAtSeconds;\n  let planFingerprint = buildPlanFingerprint(planRow.plan_date, planRow.planned_hours);\n  let fingerprintMatches =\n    planFingerprint !== null &&\n    row.validated_plan_fingerprint === planFingerprint;\n\n  if (\n    !fingerprintMatches ||\n    !isFinite(validatedAtSeconds) ||\n    validationAgeSeconds < 0\n  ) {\n    return false;\n  }\n\n  if (\n    row.health_status === "healthy" &&\n    validationAgeSeconds <= MAX_BACKEND_VALIDATION_AGE_SECONDS\n  ) {\n    return true;\n  }\n\n  // A later optimizer_invalid result must not cancel an already validated\n  // plan. That would create the exact unsafe failure mode where the optimizer\n  // decides more heat is needed, becomes unhealthy because no valid replacement\n  // can be published, and Shelly then refuses the previously approved heating\n  // hour. Preserve the matching plan only for optimizer_invalid, and only while\n  // fresh run attempts prove the backend cron is still alive. Infrastructure\n  // failures (run_error/deferred/etc.) continue to fail over exactly as before.\n  let runAttemptAtSeconds = parsePostgresTimestampSeconds(row.last_run_attempt_at);\n  let runAttemptAgeSeconds = nowSeconds - runAttemptAtSeconds;\n  return (\n    row.health_status === "unhealthy" &&\n    row.last_outcome === "optimizer_invalid" &&\n    isFinite(runAttemptAtSeconds) &&\n    runAttemptAgeSeconds >= 0 &&\n    runAttemptAgeSeconds <= MAX_BACKEND_RUN_ATTEMPT_AGE_SECONDS\n  );\n}\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = 'let heartbeatPath = "backend_heating_optimizer_state?select=health_status,last_validated_plan_at,validated_plan_fingerprint&id=eq.1&limit=1";'
          new = 'let heartbeatPath = "backend_heating_optimizer_state?select=health_status,last_outcome,last_run_attempt_at,last_validated_plan_at,validated_plan_fingerprint&id=eq.1&limit=1";'
          assert old in text
          text = text.replace(old, new, 1)
          controller.write_text(text)

          test = Path('energiazen-mini/shelly/energyzen-controller.test.js')
          t = test.read_text()
          anchor = 'assert.strictEqual(trustedControl([{ health_status: "unhealthy", last_validated_plan_at: "2026-08-13T11:30:00Z", validated_plan_fingerprint: "2026-08-13|15" }]).source, "backup", "unhealthy status falls back");\n'
          addition = anchor + '''\n// Hotfix regression: optimizer_invalid means the latest candidate could not be\n// published; it must not retroactively cancel the last validated matching plan\n// while the backend cron is still demonstrably alive.\nassert.strictEqual(\n  trustedControl([{\n    health_status: "unhealthy",\n    last_outcome: "optimizer_invalid",\n    last_run_attempt_at: "2026-08-13T11:56:00Z",\n    last_validated_plan_at: "2026-08-13T10:00:00Z",\n    validated_plan_fingerprint: "2026-08-13|15",\n  }]).source,\n  "energyzen",\n  "optimizer_invalid + fresh backend run + matching previously validated plan remains trusted",\n);\nassert.strictEqual(\n  trustedControl([{\n    health_status: "unhealthy",\n    last_outcome: "optimizer_invalid",\n    last_run_attempt_at: "2026-08-13T11:44:59Z",\n    last_validated_plan_at: "2026-08-13T10:00:00Z",\n    validated_plan_fingerprint: "2026-08-13|15",\n  }]).source,\n  "backup",\n  "optimizer_invalid does not preserve trust once backend run attempts are stale",\n);\nassert.strictEqual(\n  trustedControl([{\n    health_status: "unhealthy",\n    last_outcome: "run_error",\n    last_run_attempt_at: "2026-08-13T11:56:00Z",\n    last_validated_plan_at: "2026-08-13T10:00:00Z",\n    validated_plan_fingerprint: "2026-08-13|15",\n  }]).source,\n  "backup",\n  "infrastructure/run errors still fail over even with a fresh run attempt",\n);\nassert.strictEqual(\n  trustedControl([{\n    health_status: "unhealthy",\n    last_outcome: "optimizer_invalid",\n    last_run_attempt_at: "2026-08-13T11:56:00Z",\n    last_validated_plan_at: "2026-08-13T10:00:00Z",\n    validated_plan_fingerprint: "2026-08-13|7,8",\n  }]).source,\n  "backup",\n  "optimizer_invalid never preserves trust across a fingerprint mismatch",\n);\n'''
          assert anchor in t
          t = t.replace(anchor, addition, 1)
          test.write_text(t)
          PY

      - name: Install dependencies
        working-directory: energiazen-mini
        run: npm ci
      - name: Regenerate Shelly minified controller
        working-directory: energiazen-mini
        run: npx terser shelly/energyzen-controller.js --compress --mangle --output shelly/energyzen-controller.min.js
      - name: Run focused Shelly tests
        working-directory: energiazen-mini
        run: node shelly/energyzen-controller.test.js
      - name: Run project tests
        working-directory: energiazen-mini
        run: npm test
      - name: Typecheck
        working-directory: energiazen-mini
        run: npx tsc --noEmit
      - name: Lint
        working-directory: energiazen-mini
        run: npm run lint
      - name: Commit hotfix and remove staging workflow
        run: |
          rm .github/workflows/zz-hotfix-preserve-validated-plan.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add energiazen-mini/shelly/energyzen-controller.js energiazen-mini/shelly/energyzen-controller.min.js energiazen-mini/shelly/energyzen-controller.test.js .github/workflows/zz-hotfix-preserve-validated-plan.yml
          git commit -m "fix(shelly): preserve validated plan on optimizer invalid"
          git push
