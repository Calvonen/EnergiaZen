name: Remove Home water draw card

on:
  push:
    branches:
      - feature/remove-home-water-draw-card
    paths:
      - ".github/workflows/remove-home-water-draw-card.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/remove-home-water-draw-card
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/remove_home_water_draw_card.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: energiazen-mini/package-lock.json
      - name: Install dependencies
        working-directory: energiazen-mini
        run: npm ci
      - name: Test
        working-directory: energiazen-mini
        run: npm test
      - name: Typecheck
        working-directory: energiazen-mini
        run: npx tsc --noEmit
      - name: Lint
        working-directory: energiazen-mini
        run: npm run lint
      - name: Commit final patch
        run: |
          rm -f .github/scripts/remove_home_water_draw_card.py .github/workflows/remove-home-water-draw-card.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(home): remove water usage history shortcut"
          git push origin HEAD:feature/remove-home-water-draw-card
