name: Apply PR215 backend-correlation wiring

on:
  push:
    branches:
      - feature/heating-cooldown-blocked-marker

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/heating-cooldown-blocked-marker
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: energiazen-mini/package-lock.json

      - name: Wire backend validation freshness
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path('energiazen-mini')

          hook = root / 'lib/useHeatingOptimizationRun.ts'
          text = hook.read_text(encoding='utf-8')
          replacements = [
            (
              '''  appSettings: EnergiaZenSettings;\n  todayPlanDate: string | null;\n  tomorrowPlanDate: string | null;\n};''',
              '''  appSettings: EnergiaZenSettings;\n  readingCreatedAt: string | null;\n  todayPlanDate: string | null;\n  tomorrowPlanDate: string | null;\n};''',
            ),
            (
              '''    inputKey: "",\n    result: null,\n    runId: 0,\n    todayPlanDate: null,''',
              '''    inputKey: "",\n    readingCreatedAt: null,\n    result: null,\n    runId: 0,\n    todayPlanDate: null,''',
            ),
            (
              '''            inputKey,\n            result,\n            runId: acceptedRunId,\n            todayPlanDate,''',
              '''            inputKey,\n            readingCreatedAt: snapshot.readingCreatedAt,\n            result,\n            runId: acceptedRunId,\n            todayPlanDate,''',
            ),
          ]
          for old, new in replacements:
            assert old in text, old
            text = text.replace(old, new, 1)
          hook.write_text(text, encoding='utf-8')

          index = root / 'app/(tabs)/index.tsx'
          text = index.read_text(encoding='utf-8')

          replacements = [
            (
              'import { getCooldownBlockedHeatingHourId } from "@/lib/heatingCooldownMarker";',
              '''import {\n  getCooldownBlockedHeatingHourId,\n  type BackendHeatingOptimizerValidation,\n} from "@/lib/heatingCooldownMarker";''',
            ),
            (
              '''type StoredHeatingPlan = {\n  mode?: string | null;\n  plan_date?: string | null;\n  planned_hours?: unknown;\n  reason?: string | null;\n  target_hours?: number | null;\n  updated_at?: string | null;\n};''',
              '''type StoredHeatingPlan = {\n  mode?: string | null;\n  plan_date?: string | null;\n  planned_hours?: unknown;\n  reason?: string | null;\n  target_hours?: number | null;\n  updated_at?: string | null;\n};\n\ntype BackendHeatingOptimizerState = BackendHeatingOptimizerValidation;''',
            ),
            (
              '''  const [storedHeatingPlans, setStoredHeatingPlans] = useState<\n    Record<string, StoredHeatingPlan>\n  >({});\n  const storedHeatingPlansRef = useRef(storedHeatingPlans);''',
              '''  const [storedHeatingPlans, setStoredHeatingPlans] = useState<\n    Record<string, StoredHeatingPlan>\n  >({});\n  const [backendHeatingOptimizerState, setBackendHeatingOptimizerState] =\n    useState<BackendHeatingOptimizerState | null>(null);\n  const storedHeatingPlansRef = useRef(storedHeatingPlans);''',
            ),
            (
              '''      const { data, error } = await supabase\n        .from("heating_plans")\n        .select(storedHeatingPlanColumns)\n        .in("plan_date", planDates);\n\n      if (error) {\n        console.warn("Failed to load heating plans", error);\n        return;\n      }''',
              '''      const { data, error } = await supabase\n        .from("heating_plans")\n        .select(storedHeatingPlanColumns)\n        .in("plan_date", planDates);\n\n      if (error) {\n        console.warn("Failed to load heating plans", error);\n        if (\n          isHomeScreenMountedRef.current &&\n          generation === loadHeatingPlansGenerationRef.current\n        ) {\n          setBackendHeatingOptimizerState(null);\n        }\n        return;\n      }\n\n      const { data: backendStateData, error: backendStateError } = await supabase\n        .from("backend_heating_optimizer_state")\n        .select(\n          "health_status,last_validated_plan_at,validated_plan_date,validated_planned_hours,validated_plan_fingerprint",\n        )\n        .eq("id", 1)\n        .maybeSingle();\n\n      if (backendStateError) {\n        console.warn(\n          "Failed to load backend heating optimizer state",\n          backendStateError,\n        );\n      }''',
            ),
            (
              '''      if (\n        !isHomeScreenMountedRef.current ||\n        generation !== loadHeatingPlansGenerationRef.current\n      ) {\n        return;\n      }\n\n      setStoredHeatingPlans((currentPlans) => {''',
              '''      if (\n        !isHomeScreenMountedRef.current ||\n        generation !== loadHeatingPlansGenerationRef.current\n      ) {\n        return;\n      }\n\n      setBackendHeatingOptimizerState(\n        backendStateError\n          ? null\n          : ((backendStateData ?? null) as BackendHeatingOptimizerState | null),\n      );\n\n      setStoredHeatingPlans((currentPlans) => {''',
            ),
            (
              '''    return getCooldownBlockedHeatingHourId({\n      isCurrentlyHeating: isCurrentlyHeatingConfirmed,\n      now: currentTime,\n      optimizerHours: publishedOptimizerHours,\n      optimizerSelectedHourIds:\n        heatingOptimization?.selectedHeatingHourIds ?? [],\n      storedTodayHours: normalizeStoredHeatingPlanHours(\n        storedHeatingPlans[publishedTodayPlanDate]?.planned_hours,\n      ),\n      todayPlanDate: publishedTodayPlanDate,\n      topTemperature: topTemp,\n    });''',
              '''    return getCooldownBlockedHeatingHourId({\n      backendValidation: backendHeatingOptimizerState,\n      isCurrentlyHeating: isCurrentlyHeatingConfirmed,\n      now: currentTime,\n      optimizerHours: publishedOptimizerHours,\n      optimizerReadingCreatedAt: activeOptimizationRun.readingCreatedAt,\n      optimizerSelectedHourIds:\n        heatingOptimization?.selectedHeatingHourIds ?? [],\n      storedTodayHours: normalizeStoredHeatingPlanHours(\n        storedHeatingPlans[publishedTodayPlanDate]?.planned_hours,\n      ),\n      todayPlanDate: publishedTodayPlanDate,\n      topTemperature: topTemp,\n    });''',
            ),
            (
              '''  }, [\n    currentTime,\n    heatingOptimization?.selectedHeatingHourIds,''',
              '''  }, [\n    activeOptimizationRun.readingCreatedAt,\n    backendHeatingOptimizerState,\n    currentTime,\n    heatingOptimization?.selectedHeatingHourIds,''',
            ),
          ]

          for old, new in replacements:
            assert old in text, old
            text = text.replace(old, new, 1)
          index.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        working-directory: energiazen-mini
        run: npm ci

      - name: Test
        working-directory: energiazen-mini
        run: npm test

      - name: Lint
        working-directory: energiazen-mini
        run: npm run lint

      - name: Typecheck
        working-directory: energiazen-mini
        run: npx tsc --noEmit

      - name: Commit and clean up one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/zz-fix-pr215-v2.yml
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add energiazen-mini/app/'(tabs)'/index.tsx \
                  energiazen-mini/lib/useHeatingOptimizationRun.ts \
                  .github/workflows/zz-fix-pr215-v2.yml
          git commit -m "fix(heating): wire cooldown marker to backend run"
          git push origin HEAD:feature/heating-cooldown-blocked-marker
