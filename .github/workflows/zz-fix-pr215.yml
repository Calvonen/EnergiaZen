name: Apply PR215 freshness fix

on:
  push:
    branches:
      - feature/heating-cooldown-blocked-marker

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/heating-cooldown-blocked-marker
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: energiazen-mini/package-lock.json

      - name: Apply fail-closed cooldown freshness fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path('energiazen-mini')

          helper = root / 'lib/heatingCooldownMarker.ts'
          helper.write_text('''import type { HeatingOptimizationHour } from "./heatingOptimizer";
          import { getFinnishDateKey, getHelsinkiHourNumber } from "./heatingLogic";

          export const postHeatingCooldownSafetyTopTemperature = 50;
          export const backendOptimizerValidationMaxAgeMs = 90 * 60 * 1000;

          export type BackendHeatingOptimizerValidation = {
            health_status: string | null;
            last_validated_plan_at: string | null;
            validated_plan_date: string | null;
            validated_plan_fingerprint: string | null;
            validated_planned_hours: unknown;
          };

          function normalizePlanHours(value: unknown): number[] | null {
            if (!Array.isArray(value)) {
              return null;
            }

            return [...new Set(value.filter((hour) => Number.isInteger(hour)))]
              .map(Number)
              .sort((first, second) => first - second);
          }

          function buildPlanFingerprint(planDate: string, plannedHours: unknown) {
            const hours = normalizePlanHours(plannedHours);
            return /^\\d{4}-\\d{2}-\\d{2}$/.test(planDate) && hours
              ? `${planDate}|${hours.join(",")}`
              : null;
          }

          export function isBackendValidationCurrentForCooldown({
            backendValidation,
            now,
            optimizerReadingCreatedAt,
            storedTodayHours,
            todayPlanDate,
          }: {
            backendValidation: BackendHeatingOptimizerValidation | null;
            now: Date;
            optimizerReadingCreatedAt: string | null;
            storedTodayHours: number[];
            todayPlanDate: string;
          }): boolean {
            if (!backendValidation || backendValidation.health_status !== "healthy") {
              return false;
            }

            const validationAt = Date.parse(
              backendValidation.last_validated_plan_at ?? "",
            );
            const readingAt = Date.parse(optimizerReadingCreatedAt ?? "");
            const nowMs = now.getTime();
            if (
              !Number.isFinite(validationAt) ||
              !Number.isFinite(readingAt) ||
              validationAt > nowMs ||
              nowMs - validationAt > backendOptimizerValidationMaxAgeMs ||
              validationAt < readingAt ||
              backendValidation.validated_plan_date !== todayPlanDate
            ) {
              return false;
            }

            const normalizedStoredHours = normalizePlanHours(storedTodayHours);
            const normalizedValidatedHours = normalizePlanHours(
              backendValidation.validated_planned_hours,
            );
            if (
              !normalizedStoredHours ||
              !normalizedValidatedHours ||
              JSON.stringify(normalizedStoredHours) !==
                JSON.stringify(normalizedValidatedHours)
            ) {
              return false;
            }

            return (
              backendValidation.validated_plan_fingerprint ===
              buildPlanFingerprint(todayPlanDate, normalizedStoredHours)
            );
          }

          export function getCooldownBlockedHeatingHourId({
            backendValidation,
            isCurrentlyHeating,
            now,
            optimizerHours,
            optimizerReadingCreatedAt,
            optimizerSelectedHourIds,
            storedTodayHours,
            todayPlanDate,
            topTemperature,
          }: {
            backendValidation: BackendHeatingOptimizerValidation | null;
            isCurrentlyHeating: boolean;
            now: Date;
            optimizerHours: HeatingOptimizationHour[];
            optimizerReadingCreatedAt: string | null;
            optimizerSelectedHourIds: string[];
            storedTodayHours: number[];
            todayPlanDate: string;
            topTemperature: number | null;
          }): string | null {
            if (
              !isCurrentlyHeating ||
              topTemperature === null ||
              topTemperature < postHeatingCooldownSafetyTopTemperature ||
              !isBackendValidationCurrentForCooldown({
                backendValidation,
                now,
                optimizerReadingCreatedAt,
                storedTodayHours,
                todayPlanDate,
              })
            ) {
              return null;
            }

            const currentHour = optimizerHours.find(
              (hour) =>
                getFinnishDateKey(hour.startDate) === todayPlanDate &&
                hour.date.getTime() <= now.getTime() &&
                hour.endDate.getTime() > now.getTime(),
            );
            if (!currentHour) {
              return null;
            }

            const currentHourNumber = getHelsinkiHourNumber(currentHour.date);
            if (!storedTodayHours.includes(currentHourNumber)) {
              return null;
            }

            const nextHour = optimizerHours.find(
              (hour) => hour.date.getTime() === currentHour.endDate.getTime(),
            );
            if (!nextHour || getFinnishDateKey(nextHour.startDate) !== todayPlanDate) {
              return null;
            }

            const nextHourNumber = getHelsinkiHourNumber(nextHour.date);
            if (storedTodayHours.includes(nextHourNumber)) {
              return null;
            }

            return optimizerSelectedHourIds.includes(nextHour.id) ? nextHour.id : null;
          }
          '''.replace('          ', ''), encoding='utf-8')

          test = root / 'lib/heatingCooldownMarker.test.ts'
          test.write_text('''import assert from "node:assert/strict";

          import { getCooldownBlockedHeatingHourId } from "./heatingCooldownMarker";
          import type { HeatingOptimizationHour } from "./heatingOptimizer";

          function createHour(id: string, start: string): HeatingOptimizationHour {
            const date = new Date(start);

            return {
              date,
              endDate: new Date(date.getTime() + 60 * 60 * 1000),
              id,
              isCurrentHour: id === "current" || id === "first-03",
              price: 1,
              segmentHours: 1,
              startDate: start,
            };
          }

          export function runHeatingCooldownMarkerUnitTests() {
            const currentHour = createHour("current", "2025-01-15T10:00:00+02:00");
            const nextHour = createHour("next", "2025-01-15T11:00:00+02:00");
            const baseBackendValidation = {
              health_status: "healthy",
              last_validated_plan_at: "2025-01-15T08:29:30.000Z",
              validated_plan_date: "2025-01-15",
              validated_plan_fingerprint: "2025-01-15|10",
              validated_planned_hours: [10],
            };
            const baseInput = {
              backendValidation: baseBackendValidation,
              isCurrentlyHeating: true,
              now: new Date("2025-01-15T10:30:00+02:00"),
              optimizerHours: [currentHour, nextHour],
              optimizerReadingCreatedAt: "2025-01-15T08:29:00.000Z",
              optimizerSelectedHourIds: [currentHour.id, nextHour.id],
              storedTodayHours: [10],
              todayPlanDate: "2025-01-15",
              topTemperature: 50,
            };

            assert.equal(
              getCooldownBlockedHeatingHourId(baseInput),
              nextHour.id,
              "the optimizer-selected adjacent hour should be marked when cooldown removed it",
            );
            assert.equal(
              getCooldownBlockedHeatingHourId({
                ...baseInput,
                backendValidation: {
                  ...baseBackendValidation,
                  validated_plan_fingerprint: "2025-01-15|10,11",
                  validated_planned_hours: [10, 11],
                },
                storedTodayHours: [10, 11],
              }),
              null,
              "an already-planned next hour must keep its normal heating marker",
            );
            assert.equal(
              getCooldownBlockedHeatingHourId({ ...baseInput, topTemperature: 49.9 }),
              null,
              "cooldown must not block below the 50 degree safety threshold",
            );
            assert.equal(
              getCooldownBlockedHeatingHourId({
                ...baseInput,
                isCurrentlyHeating: false,
              }),
              null,
              "cooldown must not be diagnosed when heating is inactive",
            );
            assert.equal(
              getCooldownBlockedHeatingHourId({
                ...baseInput,
                optimizerReadingCreatedAt: "2025-01-15T08:29:31.000Z",
              }),
              null,
              "a tank reading newer than backend validation must suppress the marker",
            );

            const firstRepeatedHour = createHour(
              "first-03",
              "2025-10-26T03:00:00+03:00",
            );
            const secondRepeatedHour = createHour(
              "second-03",
              "2025-10-26T03:00:00+02:00",
            );
            assert.equal(
              getCooldownBlockedHeatingHourId({
                ...baseInput,
                backendValidation: {
                  health_status: "healthy",
                  last_validated_plan_at: "2025-10-26T00:29:30.000Z",
                  validated_plan_date: "2025-10-26",
                  validated_plan_fingerprint: "2025-10-26|3",
                  validated_planned_hours: [3],
                },
                now: new Date("2025-10-26T03:30:00+03:00"),
                optimizerHours: [firstRepeatedHour, secondRepeatedHour],
                optimizerReadingCreatedAt: "2025-10-26T00:29:00.000Z",
                optimizerSelectedHourIds: [firstRepeatedHour.id, secondRepeatedHour.id],
                storedTodayHours: [3],
                todayPlanDate: "2025-10-26",
              }),
              null,
              "the second repeated Helsinki 03:00 is already represented by the stored hour",
            );
          }
          '''.replace('          ', ''), encoding='utf-8')

          hook = root / 'lib/useHeatingOptimizationRun.ts'
          text = hook.read_text(encoding='utf-8')
          old = '''  appSettings: EnergiaZenSettings;\n  todayPlanDate: string | null;\n  tomorrowPlanDate: string | null;\n};'''
          new = '''  appSettings: EnergiaZenSettings;\n  readingCreatedAt: string | null;\n  todayPlanDate: string | null;\n  tomorrowPlanDate: string | null;\n};'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''    inputKey: "",\n    result: null,\n    runId: 0,\n    todayPlanDate: null,'''
          new = '''    inputKey: "",\n    readingCreatedAt: null,\n    result: null,\n    runId: 0,\n    todayPlanDate: null,'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''            inputKey,\n            result,\n            runId: acceptedRunId,\n            todayPlanDate,'''
          new = '''            inputKey,\n            readingCreatedAt: snapshot.readingCreatedAt,\n            result,\n            runId: acceptedRunId,\n            todayPlanDate,'''
          assert old in text
          text = text.replace(old, new, 1)
          hook.write_text(text, encoding='utf-8')

          index = root / 'app/(tabs)/index.tsx'
          text = index.read_text(encoding='utf-8')
          old = 'import { getCooldownBlockedHeatingHourId } from "@/lib/heatingCooldownMarker";'
          new = '''import {\n  getCooldownBlockedHeatingHourId,\n  type BackendHeatingOptimizerValidation,\n} from "@/lib/heatingCooldownMarker";'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''type StoredHeatingPlan = {\n  mode?: string | null;\n  plan_date?: string | null;\n  planned_hours?: unknown;\n  reason?: string | null;\n  target_hours?: number | null;\n  updated_at?: string | null;\n};'''
          new = old + '''\n\ntype BackendHeatingOptimizerState = BackendHeatingOptimizerValidation;'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''  const [storedHeatingPlans, setStoredHeatingPlans] = useState<\n    Record<string, StoredHeatingPlan>\n  >({});\n  const storedHeatingPlansRef = useRef(storedHeatingPlans);'''
          new = '''  const [storedHeatingPlans, setStoredHeatingPlans] = useState<\n    Record<string, StoredHeatingPlan>\n  >({});\n  const [backendHeatingOptimizerState, setBackendHeatingOptimizerState] =\n    useState<BackendHeatingOptimizerState | null>(null);\n  const storedHeatingPlansRef = useRef(storedHeatingPlans);'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''      const { data, error } = await supabase\n        .from("heating_plans")\n        .select(storedHeatingPlanColumns)\n        .in("plan_date", planDates);\n\n      if (error) {\n        console.warn("Failed to load heating plans", error);\n        return;\n      }'''
          new = '''      const [plansResult, backendStateResult] = await Promise.all([\n        supabase\n          .from("heating_plans")\n          .select(storedHeatingPlanColumns)\n          .in("plan_date", planDates),\n        supabase\n          .from("backend_heating_optimizer_state")\n          .select(\n            "health_status,last_validated_plan_at,validated_plan_date,validated_planned_hours,validated_plan_fingerprint",\n          )\n          .eq("id", 1)\n          .maybeSingle(),\n      ]);\n      const { data, error } = plansResult;\n\n      if (error) {\n        console.warn("Failed to load heating plans", error);\n        if (\n          isHomeScreenMountedRef.current &&\n          generation === loadHeatingPlansGenerationRef.current\n        ) {\n          setBackendHeatingOptimizerState(null);\n        }\n        return;\n      }\n\n      if (backendStateResult.error) {\n        console.warn(\n          "Failed to load backend heating optimizer state",\n          backendStateResult.error,\n        );\n      }'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''      if (\n        !isHomeScreenMountedRef.current ||\n        generation !== loadHeatingPlansGenerationRef.current\n      ) {\n        return;\n      }\n\n      setStoredHeatingPlans((currentPlans) => {'''
          new = '''      if (\n        !isHomeScreenMountedRef.current ||\n        generation !== loadHeatingPlansGenerationRef.current\n      ) {\n        return;\n      }\n\n      setBackendHeatingOptimizerState(\n        backendStateResult.error\n          ? null\n          : ((backendStateResult.data ?? null) as BackendHeatingOptimizerState | null),\n      );\n\n      setStoredHeatingPlans((currentPlans) => {'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    return getCooldownBlockedHeatingHourId({\n      isCurrentlyHeating: isCurrentlyHeatingConfirmed,\n      now: currentTime,\n      optimizerHours: publishedOptimizerHours,\n      optimizerSelectedHourIds:\n        heatingOptimization?.selectedHeatingHourIds ?? [],\n      storedTodayHours: normalizeStoredHeatingPlanHours(\n        storedHeatingPlans[publishedTodayPlanDate]?.planned_hours,\n      ),\n      todayPlanDate: publishedTodayPlanDate,\n      topTemperature: topTemp,\n    });'''
          new = '''    return getCooldownBlockedHeatingHourId({\n      backendValidation: backendHeatingOptimizerState,\n      isCurrentlyHeating: isCurrentlyHeatingConfirmed,\n      now: currentTime,\n      optimizerHours: publishedOptimizerHours,\n      optimizerReadingCreatedAt: activeOptimizationRun.readingCreatedAt,\n      optimizerSelectedHourIds:\n        heatingOptimization?.selectedHeatingHourIds ?? [],\n      storedTodayHours: normalizeStoredHeatingPlanHours(\n        storedHeatingPlans[publishedTodayPlanDate]?.planned_hours,\n      ),\n      todayPlanDate: publishedTodayPlanDate,\n      topTemperature: topTemp,\n    });'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''  }, [\n    currentTime,\n    heatingOptimization?.selectedHeatingHourIds,'''
          new = '''  }, [\n    activeOptimizationRun.readingCreatedAt,\n    backendHeatingOptimizerState,\n    currentTime,\n    heatingOptimization?.selectedHeatingHourIds,'''
          assert old in text
          text = text.replace(old, new, 1)
          index.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        working-directory: energiazen-mini
        run: npm ci

      - name: Test
        working-directory: energiazen-mini
        run: npm test

      - name: Lint
        working-directory: energiazen-mini
        run: npm run lint

      - name: Typecheck
        working-directory: energiazen-mini
        run: npx tsc --noEmit

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/zz-fix-pr215.yml
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add energiazen-mini/app/'(tabs)'/index.tsx \
                  energiazen-mini/lib/heatingCooldownMarker.ts \
                  energiazen-mini/lib/heatingCooldownMarker.test.ts \
                  energiazen-mini/lib/useHeatingOptimizationRun.ts \
                  .github/workflows/zz-fix-pr215.yml
          git commit -m "fix(heating): correlate cooldown marker with backend run"
          git push origin HEAD:feature/heating-cooldown-blocked-marker
